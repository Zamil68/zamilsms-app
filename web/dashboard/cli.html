<!-- cli.html — injected by cli.js -->


<div id="cliPage" style="display:none">
<div class="cli-wrap">
  <div class="cli-head">
    <button class="cli-back" onclick="closeCliPage()">←</button>
    <h1>CLI Insights</h1>
    <span class="cli-live"><i></i>Live</span>
    <button class="cli-rbtn" id="cliRefreshBtn" onclick="cliDoRefresh()" title="Refresh now">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:16px;height:16px"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
  </div>

  <div class="cli-hero">
    <div class="cli-hero-grid">
      <div class="cli-stat"><div class="v green cli-display" id="cliStatSms">0</div><div class="k">SMS today</div></div>
      <div class="cli-stat"><div class="v blue cli-display" id="cliStatApps">0</div><div class="k">Apps (CLI)</div></div>
      <div class="cli-stat"><div class="v"><span class="flag" id="cliStatTopFlag">—</span></div><div class="k" id="cliStatTopName">Top country</div></div>
    </div>
    <div class="cli-toprow" id="cliTopCountries"></div>
  </div>

  <div class="cli-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="cliSearch" placeholder="Search app / CLI / country…" oninput="cliRenderList()" autocomplete="off">
  </div>

  <div class="cli-list" id="cliList"><div class="zload-wrap"><div class="loader"></div><div class="zload-msg">Crunching CLI traffic…</div></div></div>

</div>
</div>
